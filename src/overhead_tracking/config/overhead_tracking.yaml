# overhead_tracking -- USB3 global-shutter overhead Sphero tracker
#
# Operator workflow (each stage waits for its command):
#   ros2 service call /overhead_tracker_node/detect_arena   std_srvs/srv/Trigger
#   ros2 service call /overhead_tracker_node/detect_spheros std_srvs/srv/Trigger
#   ros2 service call /overhead_tracker_node/link_spheros \
#       multirobot_msgs/srv/Register "{callsigns: [], skip_compass: true}"
# After a lighting, gain or exposure change (robots may stay on the floor):
#   ros2 service call /overhead_tracker_node/rebuild_floor  std_srvs/srv/Trigger

overhead_tracker_node:
  ros__parameters:

    # ---------------------------------------------------------------- camera
    source: v4l2                        # v4l2 | sim | replay
    camera_device: /dev/video0
    # source: replay -- a raw MJPEG recording (e.g. recordings/<run>/raw.mjpeg).
    # Frame times come from a frames.csv next to it, else 1/camera_fps.
    replay_path: ''
    replay_rate: 1.0                    # realtime multiplier (skips frames if behind)
    replay_loop: false                  # false: hold the last frame at end of file
    replay_lockstep: false              # true: never drop, advance as frames are pulled
    # Publish every camera frame's own MJPEG bytes (not re-encoded) on
    # ~/camera/compressed, stamped with the capture time, so a rosbag holds the
    # full video. ~50-200 KB per frame at 60 fps.
    publish_raw_jpeg: false
    # 1920x1200 is the sensor's FULL field of view. 1280x720 is NOT a downscale
    # of it -- measured 2026-08-08, it is a 1:1 CENTRE CROP (matched at scale 1.00,
    # NCC 0.97, offset 316,236), so 720p throws away 33% of the horizontal and
    # 40% of the vertical field for no gain in robot detail. Magnification is
    # identical between the two modes, which is why every pixel-size constant
    # below stayed valid across the switch.
    frame_width: 1920
    frame_height: 1200
    # 60, not the 120 the sensor can do: frame period IS the exposure ceiling,
    # so halving fps doubles the light to 16.6 ms. 120 fps bought nothing the
    # tracker uses (it processes at most 60) while costing half the exposure,
    # which is what an unlit/reflective-only ball needs.
    camera_fps: 60.0                    # -> 16.6 ms exposure clamp
    fourcc: MJPG                        # native; anything else collapses the fps

    # Measured 2026-08-08 against the matte-black arena. auto_exposure=1 is
    # manual mode; AWB off or the camera recolours the LEDs frame to frame.
    v4l2_auto_exposure: 1
    v4l2_gain: 120
    v4l2_white_balance_automatic: 0
    # 0 = do not set. Exposure is clamped to the frame period, so at 200 fps the
    # ceiling is 5 ms and every requested value above it is silently ignored --
    # which is why 5000/2000/1000/500 all produced identical frames on the bench.
    # Set a real value ONLY when overriding deliberately at a lower framerate.
    v4l2_exposure_time_absolute: 0
    # Measured 2026-08-29: the driver default is 0, but this camera comes up at
    # 1, which lets it LENGTHEN EXPOSURE BY DROPPING THE FRAME RATE. On the dark
    # arena that silently cost more than half the frames -- a raw --stream-mmap
    # pull (no decode, no OpenCV) sat at 63 fps, and the node saw 48.9, while
    # the sensor was configured for 120. Forcing it to 0 restores a true 120 fps
    # even with a long exposure requested: the exposure clamps to the 8.3 ms
    # frame period instead, which is the behaviour the comment above assumes.
    # Neither USB bandwidth nor CPU was involved -- frames are only 49 KB on the
    # black arena (6.0 MB/s at 120 fps), well inside even this camera's
    # USB2-negotiated link.
    v4l2_controls_extra: 'exposure_dynamic_framerate=0'   # 'k=v,k=v' verbatim

    # UVC discards manual exposure when a stream starts, so controls have to be
    # applied after streaming is already running -- and again on every reopen.
    control_reapply_delay_sec: 1.5
    fps_warn_tolerance: 0.15            # fps sets the exposure clamp; drift matters
    camera_stale_warn_sec: 1.0
    camera_restart_sec: 5.0             # 0 disables auto-reopen
    opencv_num_threads: 1               # do not oversubscribe the cores

    # ------------------------------------------------------- robot geometry
    # Measured on the real robots at 1280x720: ball 33-35 px, point-LED
    # separation 25.8-25.9 px.
    ball_diameter_px: 34                # ROI size, overlay
    point_sep_px: 26                    # LED pair: shorter than half this is no pair
    # Red BACK + green FRONT LED search, for absolute heading (LED pair only;
    # a robot without both visible keeps its last heading). Searched, not
    # sampled at a fixed offset: measured 2026-08-29 the LED sat 22 px from
    # the ball centre.
    led_search_px: 30
    led_sat_min: 90                     # unlit ball measures ~26, lit LED ~145
    led_val_min: 60
    # Colour space of the half-res LED image the colour worker hands back:
    # hsv (worker converts the whole frame once) | bgr (each LED patch is
    # converted). Identical headings; pick by timing.
    led_color_space: bgr
    max_robots: 16

    # ------------------------------------------------------------ detection
    # A robot is a blob brighter than floor_ratio x the LOCAL floor (61 px
    # opening of still frames, so robots and tape vanish from the map). Measured:
    # robots 3.4-5.6x, blue tape <= 2.75x, floor noise <= 2.5x. At 3.2 a
    # 1,600-frame replay had 0% extra-blob frames with no reference subtraction.
    floor_ratio: 3.2
    blob_roi_margin_px: 25              # arena polygon grown by this; centroid decides
    blob_min_area_px: 200               # robot ~700-900 px at 1920x1200; fragments join
    blob_link_px: 25                    # fragment -> nearest piece within this (< a robot)
    # Rebuild the map when the in-arena floor median drifts > frac for hold s
    # (room light / daylight). Also rebuilt by ~/detect_arena and ~/rebuild_floor.
    # Assumes fixed gain + manual exposure (v4l2_gain 120).
    floor_drift_frac: 0.20
    floor_drift_hold_sec: 2.0
    floor_rebuild_frames: 5             # frames medianed by ~/detect_arena, ~/rebuild_floor

    # ------------------------------------------------------- rates/annotation
    # Processing is driven by the camera's frames: 60 = every frame, 30 = every
    # second one (each keeps its own capture stamp). Only 60 or 30; anything
    # else warns and uses 60. The camera runs at camera_fps either way.
    track_rate_hz: 60.0
    # 0 = publish every processed frame, undecimated: the pose goes out as soon
    # as it is calculated, at track_rate_hz. Decimating only added latency -- a
    # pose could sit up to a publish period before anyone saw it -- and the gate
    # can only fire on a processed frame, so a rate that does not divide
    # track_rate_hz quantises badly (15 Hz of a 30 Hz tick measured 11.5 Hz).
    # Set a positive value only to deliberately rate-limit consumers.
    publish_rate_hz: 0.0                # 0 -> every processed frame
    # 0 = OFF. The annotated JPEG stream was pure operator convenience and
    # it cost a full-frame draw + encode in a thread competing with the
    # processing. ~/detections now carries everything the overlay was drawn
    # from -- pixel u/v, field x/y, heading, blob area, status -- so an offline
    # tool can rebuild the annotated frames from a bag of that topic.
    # Set back to 15.0 when you actually want to watch the video live.
    annotate_rate_hz: 0.0
    # Log each linked robot's tracked field position to the console at 1 Hz.
    # Off by default. Toggles live on a running node:
    #   ros2 param set /overhead_tracker_node debug_positions true
    debug_positions: false
    jpeg_quality: 70
    annotate_min_quality: 40            # degrade to here before dropping a frame
    annotate_scale: 0.5                 # half-res JPEG: quarter the encode work,
                                        # and the annotated stream is for the
                                        # operator only -- detection and tracking
                                        # run on the full-res gray frame.
    annotate_queue_max: 5               # ~4.5 MB of pinned frames = memory bound
    marker_republish_hz: 1.0            # Foxglove subscribes volatile by default

    # -------------------------------------------------------------- tracking
    # One TrackManager (track_manager.py) owns every robot's track; all timing
    # is frame time, so 60 and 30 Hz processing behave the same.
    # Gate: a blob is a candidate within gate_sigma Mahalanobis on the EKF
    # position covariance, always within gate_min_cm, never beyond gate_max_cm
    # (the gate opens while a robot is unseen because P grows).
    gate_sigma: 3.0
    gate_min_cm: 15.0
    gate_max_cm: 50.0
    lost_after_s: 0.5                   # no fix for this long -> LOST
    unresolved_after_s: 2.0             # LOST for this long -> UNRESOLVED
    ambiguity_d2: 4.0                   # crossing pairings closer than this -> doubt / SUSPECT
    reacquire_ratio: 0.5                # reacquire only if nearest <= ratio x runner-up
    merge_area_frac: 1.3                # unsplit blob >= this x link-time area holds two robots
    min_sep_cm: 6.0                     # no reacquire this close to a claimed blob
    # First LED heading of a robot linked without one: first_led_n readings
    # within first_led_window_s agreeing to first_led_tol_deg (dead LEDs give
    # scattered false readings).
    first_led_n: 8
    first_led_window_s: 0.5
    first_led_tol_deg: 15.0
    extrapolate_to_now: true

    # ----------------------------------------------------------------- arena
    arena_yaml_path: ''                 # '' -> ~/overhead_field/overhead_arena.yaml
    auto_load_arena: true
    # manual is the default and the one that works: at the calibrated exposure
    # the arena reads p50 2-4 and there is simply no edge for Canny to find.
    arena_source: auto
    # Blue tape rectangle, re-located 2026-08-29 after the camera was re-aimed,
    # from a blue-channel mask (B - mean(G,R)). Corners come from fitting a line
    # to each of the four tape edges and intersecting them, NOT from a convex
    # hull + approxPolyDP: when an edge runs near the frame border the hull
    # method pins that corner to the image boundary instead of the tape.
    # Thresholds 4..11 agreed within 14 px; that stability is the real signal.
    # The usable band is far below the 16..40 of the 2026-08-08 calibration
    # because the room is dimmer now -- blue peaks at 48 (p99 27), so re-check
    # the band rather than assuming a threshold. Do NOT tune corners by matching
    # the pixel aspect to the true 1.333 -- a threshold of 10 scored "best" on
    # aspect while actually bleeding onto the wall.
    # Validation: the centre registration cross maps to (122.75, 91.52) cm
    # against a true centre of (121.9, 91.4) -- 0.84 cm. That is the real check;
    # the 4-point homography residual is always ~0 and proves nothing.
    # manual_corners_px: [259.8, 58.5, 1681.5, 53.4, 1680.8, 1109.3, 269.6, 1120.2]
    arena_long_edge_cm: 243.84          # 96 in
    arena_short_edge_cm: 182.88         # 72 in
    arena_swap_axes: false              # if perspective picked the wrong long edge
    # This margin DILATES the arena polygon (contains_cm returns d >= -margin).
    # 5 cm matches the detector's own blob_roi_margin_px (25 px ~ 4.4 cm), so a
    # robot sitting on the tape (one measured 0.2 cm outside the 182.88 cm edge
    # in kf_20261005_171405) is linked, not dropped from detect_spheros. It was 0
    # only because template NCC scored the frame rail's speculars as robots;
    # ratio blobs did not fire on the rail in replays.
    arena_margin_cm: 5.0
    arena_detect_frames: 5
    homography_residual_tol_cm: 0.5
    canny_sigma: 0.33
    morph_close_iters: 3
    border_margin_px: 6
    min_quad_area_frac: 0.05
    max_quad_area_frac: 0.95            # rejects the whole-frame noise artefact
    approx_eps_frac: 0.02
    # Hue band of the boundary tape, OpenCV's 0-179 scale. Measured 2026-08-31
    # on the current lighting: tape 102-112, mat 11-14, floor/wall 20-22, so the
    # band sits in empty space and the mask came out 165x larger than the next
    # blob. Corners are the tape CENTRELINE (outer contour + hole, averaged).
    # This is white-balance dependent -- it holds because
    # v4l2_white_balance_automatic is 0. Re-measure if the room light changes.
    arena_hue_lo: 90
    arena_hue_hi: 130

    # --------------------------------------------------------------- linking
    # probe: serial LED lit-diff (needs the robots' LEDs, live only).
    # nudge: identity by motion -- in each window where exactly one robot is
    #   commanded to move (motion_cmd echoes live, cmds.csv on a replay), the one
    #   blob that moved is that robot. Live, the node rolls each robot itself at
    #   nudge_speed for nudge_duration_sec toward free space, one at a time, no
    #   LED writes; replays (source: replay) only watch the recorded nudges.
    # Explicit choice, no fallback: a robot that does not link is reported failed.
    link_method: probe                  # probe | nudge
    nudge_speed: 50                     # floor 50 enforced (never command < 50)
    # then stop: ~30 cm at speed 50. 0.5 linked 5/7 live (2026-11-04): the stop
    # beat the 0.6-1.1 s BLE start latency; 1.0 linked 7/7.
    nudge_duration_sec: 1.0
    nudge_settle_sec: 1.5               # stop echo -> 'after' frame: BLE latency ~1 s + coast
    nudge_min_move_px: 5.0              # a blob further than this from every old one moved
    nudge_timeout_sec: 8.0              # per robot (replay: x robots, in recording time)
    # REPLAY ONLY (source: replay), overrides link_method: a reference
    # track.csv (t,robot,x,y,... field cm); each robot is linked to the
    # detect_spheros blob nearest its first row. For recordings without a
    # solo-nudge phase. Ignored on a live camera.
    link_seed_csv: ''
    probe_red: 255
    probe_green: 255
    probe_blue: 255
    lit_delta_thresh: 40.0
    lit_min_area_px: 20
    link_tol_px: 25.0
    render_timeout_seconds: 6.0
    off_timeout_seconds: 4.0
    probe_poll_seconds: 0.2             # LED re-asserted every poll: other nodes
                                        # write LEDs too and will stomp the probe
    # All targets are commanded dark before the first pre-frame. These are
    # fire-and-forget BLE writes, one per robot, and any that has not landed
    # leaves that robot lit in its own pre-frame -- which reads as `no_lit`
    # because the diff sees no CHANGE. 0.5 s was not enough for 6 robots.
    reset_settle_seconds: 2.0
    heartbeat_fresh_sec: 15.0
    skip_compass_default: true
    # Camera-closed-loop aim calibration, run per robot at link time when
    # skip_compass is FALSE (it replaces the magnetometer spin). Target is
    # field +x -- LEFT-TO-RIGHT in the camera image. reset_aim FIRST so the
    # robot's heading 0 is its current orientation and the camera reading IS
    # the offset; turn by it, reset_aim again. NOTE Sphero headings are
    # CLOCKWISE-positive (0 forward, 90 right) while field angles are
    # counter-clockwise, so the corrective turn is +meas, not -meas.
    aim_tolerance_deg: 8.0              # comfortably inside the 15 deg bank step
    # Fire-and-forget: _reset_aim and _set_robot_heading publish a String and
    # nothing acks, so this is the ONLY thing that waits for the robot to finish
    # turning. Measured 2026-08-31 at 1.5 s, two of four robots verified 11-14
    # deg off against an 8 deg tolerance -- consistent with measuring mid-turn.
    aim_settle_seconds: 3.0
    compass_timeout_seconds: 25.0

    # ----------------------------------------------- motion model / heading EKF
    # Per robot [x, y, theta] (ekf.py), driven by its sphero/<ns>/motion_cmd
    # echoes: speed applied lag_v_sec late (start/stop latency + coast), turns
    # from CHANGES of the commanded heading at <= turn_rate_dps, so the robot's
    # aim offset cancels. theta comes from the LED pair; until the first fix the
    # speed is not applied and q_pos_no_heading carries the motion.
    # Q per second from covariance consistency on kf_20261005_171405 +
    # motion_20261005_16* (2026-11-04): 3-sigma gate holds 98-99 % of real
    # 0.3-1 s prediction errors.
    q_pos: 100.0                        # cm^2/s
    q_th: 0.3                           # rad^2/s
    q_pos_no_heading: 500.0             # cm^2/s
    r_pos: 0.05                         # cm^2
    r_th: 0.001                         # rad^2 (LED jitter 1.3-1.5 deg)
    lag_v_sec: 0.45
    turn_rate_dps: 180.0
    # Scales the Sphero roll `speed` field (0-255) to cm/s for the control
    # input. Measured 2026-08-31 over a 182.88 cm (6 ft) straight run: speed 50
    # -> 6.00 s, 100 -> 2.88 s, 150 -> 2.05 s, i.e. 30.5 / 63.5 / 89.2 cm/s.
    # Least-squares through the origin gives 0.607, max residual 4% (speed 100
    # is the outlier). A free intercept is not significant (+2.3 +/- 4.6 cm/s),
    # so the proportional form is used. Above speed 150 this is extrapolation --
    # motor saturation is unmeasured. Single run per speed; the 4% scatter is
    # the size of hand-timing error, so repeats would tighten it, not more speeds.
    cmd_speed_to_cms: 0.61
    sphere_radius_mm: 36.5

    # ------------------------------------------------------------------- sim
    sim_spheros: 5
    seed: 0
