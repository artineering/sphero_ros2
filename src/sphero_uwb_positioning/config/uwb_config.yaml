# Sphero UWB Positioning Configuration
# ======================================
# Configuration for UDP-based UWB positioning system with WiFi-enabled anchors

sphero_uwb_positioning_node:
  ros__parameters:
    # ─── UDP Network Settings ───
    udp_port: 5000

    # ─── Publishing Settings ───
    # Publishing rate (Hz) for tag position estimates
    publish_rate: 10.0

    # ─── Range Processing ───
    # Maximum age (seconds) for a range measurement to be considered valid
    range_timeout: 1.0

    # Minimum anchors required for a valid 2D position estimate
    min_anchors_for_fix: 3

    # ─── Filtering and Quality ───
    # EMA filter alpha for smoothing positions (0.0–1.0)
    # 1.0 = no smoothing, 0.1 = heavy smoothing
    ema_alpha: 0.3

    # Outlier rejection threshold (meters)
    # Discard measurements with residuals exceeding this value * num_anchors
    outlier_threshold: 0.5

    # ─── Anchor Configurations ───
    # Positions in meters, defined in "sphero_arena" frame
    # Arrange anchors to span your workspace (typically rectangular)
    # All anchors send UDP packets to the same port on this host
    anchors:
      - id: 1
        x: 0.0
        y: 0.0
      - id: 2
        x: 6.0
        y: 0.0
      - id: 3
        x: 6.0
        y: 4.0
      - id: 4
        x: 0.0
        y: 4.0

    # ─── Tag-to-Sphero Mapping ───
    # Maps UWB tag IDs to Sphero robot names
    # Format: {tag_id: "sphero_name"}
    # Tags not listed here will not be tracked
    tag_sphero_mapping:
      1: "SB-3660"
      2: "SB-74FB"
      3: "SB-3716"
      # Add more tags as needed (up to 12 tags supported)
      # 4: "SB-XXXX"
      # 5: "SB-YYYY"
